name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Si tu package.json tiene el campo "packageManager" (ej.
      # "pnpm@9.x.x"), esta action detecta la versión sola y podés
      # borrar la línea "with: version:" de abajo.
      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Type check (svelte-check)
        run: pnpm check

      - name: Build
        run: pnpm build