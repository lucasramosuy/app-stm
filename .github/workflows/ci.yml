name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # pnpm/setup reemplaza a pnpm/action-setup + actions/setup-node en
      # un solo paso (instala pnpm y Node juntos). Si tu package.json
      # tiene el campo "packageManager" (ej. "pnpm@9.x.x"), lo detecta
      # solo y podés borrar la línea "version:" de abajo.
      - uses: pnpm/setup@v2
        with:
          version: 11
          runtime: node@20
          cache: true
          install: false # instalamos nosotros abajo, con --frozen-lockfile

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Type check (svelte-check)
        run: pnpm check

      - name: Build
        run: pnpm build