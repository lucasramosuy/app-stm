name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # pnpm/setup instala pnpm y Node juntos.
      - uses: pnpm/setup@v2
        with:
          version: 11
          runtime: node@20
          cache: true
          install: false # instalamos nosotros abajo, con --frozen-lockfile

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Type check (svelte-check)
        run: pnpm check

      - name: Build
        run: pnpm build

      - name: Tests (vitest)
        run: pnpm test
